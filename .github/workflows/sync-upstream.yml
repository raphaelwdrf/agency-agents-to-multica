name: sync-upstream

# Camada 1: upstream (msitarzewski/agency-agents) -> este mirror.
# Horária; pode ser disparada manualmente em Actions > sync-upstream > Run workflow.
# Reescreve skills/ a partir do upstream (cria/atualiza/remove personas), e commita
# apenas se houver mudanças. Camada 2 (Multica skill refresh) roda no servidor à parte.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream (shallow)
        run: git clone --depth 1 https://github.com/msitarzewski/agency-agents.git upstream

      - name: Rebuild mirror tree
        run: bash scripts/build-mirror.sh upstream .

      - name: Record upstream commit
        id: upstream
        run: echo "sha=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push (only when changed)
        run: |
          git config user.name  "agency-agents-sync[bot]"
          git config user.email "agency-agents-sync[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            git commit -m "sync: upstream msitarzewski/agency-agents@${{ steps.upstream.outputs.sha }}"
            git push
          fi
